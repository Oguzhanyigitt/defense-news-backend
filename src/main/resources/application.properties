# ===============================
# Veritabanı (Supabase) Bağlantısı
# ===============================
# Yeni Pooler (Havuz) adresi ve portu
spring.datasource.url=jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:5432/postgres
# Havuz bağlantısı için proje kodlu kullanıcı adı
spring.datasource.username=postgres.uskokgcgebaavlmrfiqi
# Daha önce belirlediğin şifre (Köşeli parantez olmadan)
spring.datasource.password=${SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Hibernate / JPA Ayarları
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Uygulama Ayarları
# ===============================
spring.application.name=DefenseNewsAggregator
server.port=8080